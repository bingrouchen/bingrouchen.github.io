# Pages CMS 配置 / Pages CMS configuration
# 定义后台每个输入框；一般不需要改 / Defines every field in the editor; normally no need to edit.
# Docs: https://pagescms.org/docs

media:
  input: images
  output: /images
content:
- name: projects
  label: 作品 Works
  type: file
  path: data/projects.json
  format: json
  fields:
  - name: works
    label: 作品列表 Works
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title} · {title_en} · {year}'
    fields:
    - name: title
      label: 作品名称（中文）Title (Chinese)
      type: string
      required: true
    - name: title_en
      label: 作品名称（英文）Title (English)
      type: string
      required: true
      description: 网页地址会根据英文名称自动生成 / The page address is created automatically from the English title.
    - name: section
      label: 放在哪个分区 Section
      type: select
      required: true
      description: 决定它出现在 WORKS 菜单的哪一栏 / Decides which part of the WORKS menu it appears under.
      options:
        values:
        - name: craft
          label: 工艺探索 Craft Exploration
        - name: material
          label: 材料探索 Material Exploration
        - name: others
          label: 其他 Others
    - name: draft
      label: 草稿，暂不在网站上显示 Draft (hidden from the site)
      type: boolean
      description: 内容填好后取消勾选，就会出现在网站上 / Untick when it's ready, and it will appear on the site.
    - name: year
      label: 年份 Year
      type: number
      required: true
    - name: category
      label: 类别 Category
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
    - name: tags
      label: 标签 Tags
      type: object
      list: true
      description: 作品页按这些标签筛选，相同的标签要写得一样 / Used for the filters on the Works page; spell the same tag the same way each time.
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
    - name: cover
      label: 封面图 Cover image
      type: image
      options:
        path: images/projects
      description: 首页轮播的第一张，也是作品页的缩略图。建议竖版 2:3 / First image in the home carousel and the thumbnail on the Works page. Portrait 2:3 recommended.
    - name: images
      label: 更多图片 More images
      type: image
      options:
        path: images/projects
      list: true
      description: 按顺序显示，可拖动排序 / Shown in this order; drag to reorder.
    - name: video
      label: 视频链接 Video link
      type: string
      description: YouTube 或 Vimeo 链接，没有就留空 / A YouTube or Vimeo link, or leave empty.
    - name: summary
      label: 一句话简介 Short summary
      type: object
      fields:
      - name: zh
        label: 中文
        type: text
      - name: en
        label: English
        type: text
    - name: description
      label: 项目介绍 Description
      type: object
      fields:
      - name: zh
        label: 中文
        type: text
      - name: en
        label: English
        type: text
      description: 空一行就是分段 / Leave a blank line between paragraphs.
    - name: materials
      label: 使用材料 Materials
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
- name: materials
  label: 材料库 Material Library
  type: file
  path: data/materials.json
  format: json
  list: true
  fields:
  - name: id
    label: 编号 ID
    type: string
    required: true
    description: 例如 M-001 / e.g. M-001
  - name: sample
    label: 示例条目 Sample entry
    type: boolean
    description: 勾上会显示“示例”标签；真实材料不要勾 / Shows a “Sample” badge; leave off for real materials.
  - name: name
    label: 材料名称 Name
    type: object
    fields:
    - name: zh
      label: 中文
      type: string
      required: true
    - name: en
      label: English
      type: string
      required: true
  - name: category
    label: 类别 Category
    type: object
    fields:
    - name: zh
      label: 中文
      type: string
    - name: en
      label: English
      type: string
  - name: image
    label: 材料照片 Photo
    type: image
    options:
      path: images/materials
  - name: collected
    label: 收集时间 Collected
    type: string
    description: 例如 2026-03 / e.g. 2026-03
  - name: location
    label: 收集地点 Location
    type: object
    fields:
    - name: zh
      label: 中文
      type: string
    - name: en
      label: English
      type: string
  - name: source
    label: 来源 Source
    type: object
    fields:
    - name: zh
      label: 中文
      type: string
    - name: en
      label: English
      type: string
  - name: composition
    label: 成分 Composition
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
  - name: properties
    label: 特性 Properties
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
  - name: processing
    label: 加工方式 Processing
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
  - name: endOfLife
    label: 循环 / 生命周期末端 Circularity / end of life
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
  - name: notes
    label: 备注 Notes
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
- name: about
  label: 关于 About
  type: file
  path: data/about.json
  format: json
  fields:
  - name: bio
    label: 个人简介 Bio
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
    description: 空一行就是分段 / Leave a blank line between paragraphs.
  - name: phd
    label: 博士课题 PhD research
    type: object
    fields:
    - name: zh
      label: 中文
      type: string
    - name: en
      label: English
      type: string
  - name: education
    label: 教育背景 Education
    type: object
    list: true
    fields:
    - name: year
      label: 年份 Year
      type: string
      description: 例如 2019–2022 / e.g. 2019–2022
    - name: text
      label: 内容 Entry
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
  - name: exhibitions
    label: 展览与奖项 Exhibitions & Awards
    type: object
    list: true
    fields:
    - name: year
      label: 年份 Year
      type: string
    - name: text
      label: 内容 Entry
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
- name: site
  label: 网站设置 Site settings
  type: file
  path: data/site.json
  format: json
  fields:
  - name: name
    label: 名字 Name
    type: object
    fields:
    - name: zh
      label: 中文
      type: string
      required: true
    - name: en
      label: English
      type: string
      required: true
  - name: intro
    label: 一句话介绍 Introduction
    type: object
    fields:
    - name: zh
      label: 中文
      type: text
    - name: en
      label: English
      type: text
  - name: contact
    label: 联系方式 Contact
    type: object
    description: 不想公开的留空 / Leave empty to hide.
    fields:
    - name: email
      label: 邮箱 Email
      type: string
    - name: instagram
      label: Instagram 链接 link
      type: string
    - name: linkedin
      label: LinkedIn 链接 link
      type: string
  - name: featured
    label: 首页作品顺序 Home page order
    type: string
    list: true
    description: 按顺序填作品的英文名称；留空则按年份从新到旧 / English project titles in order; leave empty to sort newest first.
  - name: sections
    label: WORKS 菜单分区名称 WORKS menu names
    type: object
    fields:
    - name: craft
      label: 工艺探索 Craft Exploration
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
    - name: material
      label: 材料探索 Material Exploration
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
    - name: others
      label: 其他 Others
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
  - name: research
    label: 研究页 Research page
    type: object
    fields:
    - name: title
      label: 标题 Title
      type: object
      fields:
      - name: zh
        label: 中文
        type: string
      - name: en
        label: English
        type: string
    - name: intro
      label: 介绍 Introduction
      type: object
      fields:
      - name: zh
        label: 中文
        type: text
      - name: en
        label: English
        type: text
  - name: splash
    label: 开屏 Intro screen
    type: object
    fields:
    - name: enabled
      label: 显示开屏 Show intro
      type: boolean
    - name: image
      label: 开屏照片 Intro photo
      type: image
      options:
        path: images
    - name: video
      label: 开屏视频（可选）Intro video (optional)
      type: string
      description: 例如 /images/splash.mp4，留空则用照片 / e.g. /images/splash.mp4; leave empty to use the photo.
    - name: dimDelay
      label: 开始变暗前停留（秒）Seconds before darkening
      type: number
    - name: dimTime
      label: 变暗变模糊用时（秒）Darken & blur duration (s)
      type: number
    - name: dim
      label: 黑色深度 0–1 Darkness 0–1
      type: number
    - name: blur
      label: 模糊程度（像素）Blur (px)
      type: number
    - name: sewDelay
      label: 开始缝名字（秒）Seconds before sewing
      type: number
    - name: seconds
      label: 开屏总时长（秒）Total length (s)
      type: number
