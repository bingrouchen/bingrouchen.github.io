# 上传图片后自动压缩 / Compress images automatically after upload
name: Compress images

on:
  push:
    branches: [main]
    paths: ["images/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compress-images
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python .github/scripts/compress_images.py
      - name: Save compressed images
        run: |
          if [ -n "$(git status --porcelain images)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images
            git commit -m "Compress uploaded images"
            git pull --rebase origin main
            git push
          else
            echo "Nothing to compress"
          fi
